name = "somewhere-mcp"
main = "mcp-server/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
API_BASE_URL = "https://api.somewhere.tech"
NEW_PROJECT_SITE_DOMAIN = "1"
ADVISOR_MODEL = "gpt-5.6-terra"

# These private service bindings are required for a self-hosted deployment.
# Replace the placeholder service names with Workers in your own account.
[[services]]
binding = "API_SERVICE"
service = "your-private-somewhere-api-service"

[[services]]
binding = "RUNNER_SERVICE"
service = "your-private-somewhere-runner-service"

# Create a namespace in your own account and replace this placeholder ID.
[[kv_namespaces]]
binding = "ADVISOR_RL_KV"
id = "00000000000000000000000000000000"
